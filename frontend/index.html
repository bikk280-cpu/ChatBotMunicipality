<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>แชทบอท เทศบาลเมืองศิลา</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Mitr:wght@300;400;500;600&family=Sarabun:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="chat.css?v=navy-3">
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
</head>
<body>

<main class="municipal-chat">
    <div class="municipal-top">
        <div class="municipal-wrap">
            <header class="municipal-brand">
                <div><strong>เทศบาลเมืองศิลา</strong><br>อำเภอเมือง จังหวัดขอนแก่น</div>
                <div class="municipal-brand-links">
                    <details class="municipal-contact-menu">
                        <summary>ติดต่อเทศบาล</summary>
                        <div class="municipal-contact-options">
                            <a href="tel:043246505">โทร 043-246505</a>
                            <a href="tel:043246506">โทร 043-246506</a>
                            <a href="https://www.sila-kk.go.th/">เว็บไซต์เทศบาล</a>
                        </div>
                    </details>
                    <a href="login.html">สำหรับเจ้าหน้าที่</a>
                </div>
            </header>
        </div>
    </div>
<!-- Cookie Banner -->
<div id="cookieBanner" class="cookie-banner" style="display:none;">
    <div class="cookie-inner">
        <p>อนุญาตให้ใช้คุกกี้เพื่อเก็บประวัติการสนทนาหรือไม่?</p>
        <div class="cookie-actions">
            <button class="btn-decline" onclick="declineCookies()"><svg class="button-icon" aria-hidden="true" focusable="false" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m18 6-12 12M6 6l12 12"/></svg><span>ปฏิเสธ</span></button>
            <button class="btn-accept" onclick="acceptCookies()"><svg class="button-icon" aria-hidden="true" focusable="false" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m20 6-11 11-5-5"/></svg><span>ยินยอม</span></button>
        </div>
    </div>
</div>

    <section class="municipal-opening municipal-wrap">
        <h1>วันนี้ให้ช่วยเรื่องอะไร?</h1>
        <section class="municipal-topics">
            <h2>เรื่องที่สอบถามได้</h2>
            <div class="municipal-choices">
                <button onclick="quickSend('ข้อมูลเทศบาล')"><svg class="button-icon" aria-hidden="true" focusable="false" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="2" width="16" height="20" rx="2"/><path d="M9 22v-4h6v4M9 6h.01M15 6h.01M9 10h.01M15 10h.01M9 14h.01M15 14h.01"/></svg><span>ข้อมูลเทศบาล</span></button>
                <button onclick="quickSend('บริการและสวัสดิการ')"><svg class="button-icon" aria-hidden="true" focusable="false" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19.5 12.57 12 20l-7.5-7.43a5 5 0 1 1 7.5-6.57 5 5 0 1 1 7.5 6.57Z"/></svg><span>บริการและสวัสดิการ</span></button>
                <button onclick="quickSend('แจ้งเรื่องร้องเรียน')"><svg class="button-icon" aria-hidden="true" focusable="false" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2zM12 7v3m0 3h.01"/></svg><span>แจ้งเรื่องร้องเรียน</span></button>
                <button onclick="quickSend('ติดต่อเทศบาล')"><svg class="button-icon" aria-hidden="true" focusable="false" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M12 16v-4m0-4h.01"/></svg><span>ติดต่อเทศบาล</span></button>
            </div>
        </section>
                <div class="municipal-conversation">
                    <div class="chat-body" id="chat" role="log" aria-label="บทสนทนา" tabindex="0"></div>
                    <div class="chat-jump">
                        <button id="jumpToLatest" type="button" aria-label="ไปที่ข้อความล่าสุด" hidden><svg class="button-icon" aria-hidden="true" focusable="false" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14m7-7-7 7-7-7"/></svg></button>
                    </div>
                    <form class="municipal-composer" onsubmit="event.preventDefault(); send()">
                        <div class="question-field">
                            <textarea id="msg" rows="1" maxlength="500" aria-label="คำถาม" aria-describedby="questionLimit" placeholder="พิมพ์คำถามของคุณ…"></textarea>
                            <span id="questionLimit" hidden></span>
                        </div>
                        <button id="sendQuestion" type="submit" aria-label="ส่งคำถาม" title="ส่งคำถาม">
                            <svg class="button-icon send-arrow" aria-hidden="true" focusable="false" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m5 12 7-7 7 7M12 19V5"/></svg>
                        </button>
                        <button id="stopWaiting" type="button" hidden><svg class="button-icon" aria-hidden="true" focusable="false" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="5" width="14" height="14" rx="2"/></svg><span>หยุดรอ</span></button>
                    </form>
                </div>
    </section>
    <div class="municipal-wrap municipal-content">
<div id="complaintForm" class="complaint-form" style="display:none;">
            <h4>📄 แบบฟอร์มแจ้งเรื่องร้องเรียน</h4>
            <input id="issue" placeholder="หัวข้อปัญหา *">
            <input id="location" placeholder="สถานที่เกิดเหตุ">
            <textarea id="detail" rows="2" placeholder="รายละเอียดเพิ่มเติม"></textarea>
            <button class="submit-btn" onclick="submitComplaint()"><svg class="button-icon" aria-hidden="true" focusable="false" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m22 2-7 20-4-9-9-4Zm0 0L11 13"/></svg><span>ส่งเรื่องร้องเรียน</span></button>
        </div>

    </div>
</main>
<script src="/config.js"></script>
<script>
    const chat = document.getElementById("chat");
    const jumpToLatest = document.getElementById("jumpToLatest");

    function updateJumpButton() {
        jumpToLatest.hidden = chat.scrollHeight - chat.clientHeight - chat.scrollTop <= 24;
    }

    chat.addEventListener("scroll", updateJumpButton, { passive: true });
    new ResizeObserver(updateJumpButton).observe(chat);
    jumpToLatest.addEventListener("click", () => {
        chat.focus({ preventScroll: true });
        chat.scrollTo({ top: chat.scrollHeight, behavior: "instant" });
        updateJumpButton();
    });
    let lastSender = null;

    function getNow() {
        return new Date().toLocaleTimeString('th-TH', { hour: '2-digit', minute: '2-digit' });
    }

    function formatTime(isoString) {
        if (!isoString) return getNow();
        try {
            const s = isoString.endsWith("Z") || isoString.includes("+") ? isoString : isoString + "+00:00";
            return new Date(s).toLocaleTimeString('th-TH', { hour: '2-digit', minute: '2-digit', timeZone: 'Asia/Bangkok' });
        } catch { return getNow(); }
    }

    function addMessage(text, sender, timestamp) {
        const row = document.createElement("div");
        row.className = `msg-row ${sender}${sender === lastSender ? ' no-avatar' : ''}`;

        const avatar = document.createElement("div");
        avatar.className = "msg-avatar";
        avatar.textContent = "🤖";

        const col = document.createElement("div");
        col.style.cssText = "display:flex;flex-direction:column;max-width:72%";
        if (sender === "user") col.style.alignItems = "flex-end";

        const bubble = document.createElement("div");
        bubble.className = "bubble";
        if (sender === "bot") {
            const label = document.createElement("span");
            label.className = "reply-label";
            label.textContent = "ผู้ช่วยเทศบาล";
            col.appendChild(label);
            bubble.innerHTML = marked.parse(text || "");
            bubble.querySelectorAll("a").forEach(a => {
                a.target = "_blank";
                a.rel = "noopener noreferrer";
            });
        } else {
            bubble.textContent = text;
        }

        const time = document.createElement("span");
        time.className = "msg-time";
        time.textContent = formatTime(timestamp);

        col.appendChild(bubble);
        col.appendChild(time);
        if (sender === "bot") {
            row.appendChild(avatar);
            row.appendChild(col);
        } else {
            row.appendChild(col);
        }

        chat.appendChild(row);
        chat.scrollTo({ top: chat.scrollHeight, behavior: "instant" });
        lastSender = sender;
        return row;
    }

    function showTypingEffect() {
        const row = document.createElement("div");
        row.className = "msg-row bot";
        row.id = "typing-loader";
        const avatar = document.createElement("div");
        avatar.className = "msg-avatar";
        avatar.textContent = "🤖";
        const bubble = document.createElement("div");
        bubble.className = "bubble";
        bubble.setAttribute("role", "status");
        bubble.textContent = "ผู้ช่วยเทศบาลกำลังตอบ…";
        row.appendChild(avatar);
        row.appendChild(bubble);
        chat.appendChild(row);
        chat.scrollTo({ top: chat.scrollHeight, behavior: "instant" });
        return row;
    }

    const input = document.getElementById("msg");
    const sendButton = document.getElementById("sendQuestion");
    const stopButton = document.getElementById("stopWaiting");
    let pendingRequest;

    function resizeInput() {
        const atLatest = jumpToLatest.hidden;
        input.style.height = "auto";
        input.style.height = Math.min(input.scrollHeight, 130) + "px";
        const remaining = input.maxLength - input.value.length;
        const questionLimit = document.getElementById("questionLimit");
        questionLimit.hidden = remaining > 50;
        questionLimit.textContent = questionLimit.hidden ? "" : `เหลือ ${remaining} ตัวอักษร`;
        if (atLatest) chat.scrollTo({ top: chat.scrollHeight, behavior: "instant" });
    }

    input.addEventListener("input", resizeInput);
    input.addEventListener("keydown", (event) => {
        if (event.key === "Enter" && !event.shiftKey && !event.isComposing) {
            event.preventDefault();
            send();
        }
    });
    stopButton.addEventListener("click", () => pendingRequest?.abort());

    async function handleChatRequest(text) {
        if (pendingRequest) return;
        pendingRequest = new AbortController();
        if (document.activeElement === sendButton) input.focus({ preventScroll: true });
        sendButton.hidden = true;
        stopButton.hidden = false;
        const consent = localStorage.getItem("chat_cookie_consent");
        const noSave = consent !== "accepted"; // ถ้าไม่ยินยอม ไม่บันทึกประวัติ แต่คุยได้
        const loader = showTypingEffect();
        try {
            const res = await fetch(`${window.API_BASE}/chat`, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                credentials: "include",
                signal: pendingRequest.signal,
                body: JSON.stringify({ message: text, no_save: noSave })
            });
            const data = await res.json();
            loader.remove();
            if (!res.ok || typeof data.answer !== "string") throw new Error("No answer");
            addMessage(data.answer, "bot").classList.add("reply-arrived");
        } catch (e) {
            loader.remove();
            const row = addMessage(e.name === "AbortError" ? "หยุดรอคำตอบแล้ว" : "รับคำตอบไม่ได้ กรุณาลองอีกครั้ง", "bot");
            const retry = document.createElement("button");
            retry.type = "button";
            retry.className = "message-action";
            retry.textContent = "ลองอีกครั้ง";
            retry.addEventListener("click", () => {
                if (pendingRequest) return;
                row.remove();
                handleChatRequest(text);
            });
            row.lastElementChild.appendChild(retry);
        } finally {
            pendingRequest = null;
            if (document.activeElement === stopButton) input.focus({ preventScroll: true });
            stopButton.hidden = true;
            sendButton.hidden = false;
        }
    }

    function send() {
        const text = input.value.trim();
        if (!text || pendingRequest) return;
        addMessage(text, "user");
        input.value = "";
        resizeInput();
        handleChatRequest(text);
    }

    function quickSend(text) {
        if (pendingRequest) return;
        addMessage(text, "user");
        handleChatRequest(text);
    }


    function toggleForm() {
        const f = document.getElementById("complaintForm");
        f.style.display = f.style.display === "none" ? "block" : "none";
    }

    async function submitComplaint() {
        const issue = document.getElementById("issue").value;
        if (!issue) { alert("กรุณาระบุหัวข้อ"); return; }
        addMessage("กำลังส่งเรื่องร้องเรียน...", "bot");
        setTimeout(() => {
            addMessage("✅ รับเรื่องร้องเรียนเรียบร้อยแล้วค่ะ เจ้าหน้าที่จะดำเนินการตรวจสอบโดยเร็ว", "bot");
            toggleForm();
            document.getElementById("issue").value = "";
        }, 1500);
    }

    function checkCookieConsent() {
        if (!localStorage.getItem("chat_cookie_consent")) {
            document.getElementById("cookieBanner").style.display = "block";
        }
    }
    function acceptCookies() {
        localStorage.setItem("chat_cookie_consent", "accepted");
        document.getElementById("cookieBanner").style.display = "none";
    }
    function declineCookies() {
        localStorage.setItem("chat_cookie_consent", "declined");
        document.getElementById("cookieBanner").style.display = "none";
    }

    async function loadHistory() {
        try {
            const res = await fetch(`${window.API_BASE}/chat/history`, { credentials: "include" });
            const data = await res.json();

            // session หมดอายุ — เคลียร์ consent และแสดง banner ใหม่
            if (data.session_expired) {
                localStorage.removeItem("chat_cookie_consent");
                document.cookie = "session_id=; Max-Age=0; path=/; SameSite=None; Secure";
                document.getElementById("cookieBanner").style.display = "block";
                return;
            }

            if (!chat.hasChildNodes() && data.history && data.history.length) {
                data.history.forEach(m => addMessage(m.content, m.role === "user" ? "user" : "bot", m.created_at));
            }
        } catch (e) {}
    }

    window.addEventListener("pagehide", (e) => {
        if (!e.persisted) {
            document.cookie = "session_id=; Max-Age=0; path=/; SameSite=None; Secure";
        }
    });


    window.onload = () => {
        checkCookieConsent();
        loadHistory();

    };

</script>

</body>
</html>
