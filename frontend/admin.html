                            <i class="bi bi-cloud-arrow-up me-1"></i> อัปโหลด

                    <div class="d-flex align-items-center gap-2">
                        <i class="bi bi-funnel text-muted"></i>
                        <select class="form-select form-select-sm" id="filterCategory" onchange="filterByCategory()" style="min-width: 220px;">
                            <option value="">ทั้งหมด</option>
                            <option value="ข้อมูลการบริหารงาน">ข้อมูลการบริหารงาน</option>
                            <option value="ข้อมูลหน่วยตรวจสอบภายใน">ข้อมูลหน่วยตรวจสอบภายใน</option>
                            <option value="ข้อมูลกองการเจ้าหน้าที่">ข้อมูลกองการเจ้าหน้าที่</option>
                            <option value="ข้อมูลกองสวัสดิการสังคม">ข้อมูลกองสวัสดิการสังคม</option>
                            <option value="ข้อมูลกองการศึกษา">ข้อมูลกองการศึกษา</option>
                            <option value="ข้อมูลกองยุทธศาสตร์และงบประมาณ">ข้อมูลกองยุทธศาสตร์และงบประมาณ</option>
                            <option value="ข้อมูลกองสาธารณสุขและสิ่งแวดล้อม">ข้อมูลกองสาธารณสุขและสิ่งแวดล้อม</option>
                            <option value="ข้อมูลกองช่าง">ข้อมูลกองช่าง</option>
                            <option value="ข้อมูลกองคลัง">ข้อมูลกองคลัง</option>
                            <option value="ข้อมูลสำนักปลัดเทศบาล">ข้อมูลสำนักปลัดเทศบาล</option>
                            <option value="ข้อมูลฝ่ายบริหาร">ข้อมูลฝ่ายบริหาร</option>
                            <option value="ข้อมูลพื้นฐาน">ข้อมูลพื้นฐาน</option>
                            <option value="ข้อมูลการให้บริการประชาชน">ข้อมูลการให้บริการประชาชน</option>
                            <option value="ศูนย์ข้อมูลข่าวสาร">ศูนย์ข้อมูลข่าวสาร</option>
                            <option value="ข้อมูลมาตรการความ">ข้อมูลมาตรการความ</option>
                            <option value="โปร่งใสการจัดการทุจริต">โปร่งใสการจัดการทุจริต</option>
                            <option value="ข้อมูลการดำเนินการเพื่อป้องกันการทุจริต">ข้อมูลการดำเนินการเพื่อป้องกันการทุจริต</option>
                            <option value="ข้อมูลการจัดซื้อจัดจ้าง">ข้อมูลการจัดซื้อจัดจ้าง</option>
                            <option value="ข้อมูลการบริหารและพัฒนาทรัพยากรบุคคล">ข้อมูลการบริหารและพัฒนาทรัพยากรบุคคล</option>
                            <option value="ข้อมูลการบริหารเงินงบประมาณ">ข้อมูลการบริหารเงินงบประมาณ</option>
                            <option value="ข้อมูลทำนุบำรุงรักษา">ข้อมูลทำนุบำรุงรักษา</option>

<script data-cfasync="false" src="/cdn-cgi/scripts/5c5dd728/cloudflare-static/email-decode.min.js"></script><script src="/config.js"></script>
<script>
    async function checkAuth() {
        try {
            const res = await fetch(`${window.API_BASE}/api/check-admin`, { credentials: "include" });
            const status = await res.json();
            if (!status.authenticated) {
                window.location.href = "/login"; // เด้งไปหน้า Login ถ้ายังไม่ได้ล็อกอิน
            }
        } catch (e) {
            window.location.href = "/login";
        }
    }
    checkAuth(); // รันทันทีเมื่อโหลดหน้า
    // --- เก็บข้อมูลเอกสารทั้งหมดไว้ filter ---
    let allDocs = [];

    function filterByCategory() {
        const selected = document.getElementById("filterCategory").value;
        const filtered = selected ? allDocs.filter(d => d.category === selected) : allDocs;
        renderTable(filtered);
        const count = document.getElementById("filterCount");
        count.textContent = selected ? `แสดง ${filtered.length} จาก ${allDocs.length} รายการ` : `${allDocs.length} รายการ`;
    }

    function renderTable(docs) {
        const tbody = document.getElementById("pdfList");
        tbody.innerHTML = "";

        if (docs.length === 0) {
            tbody.innerHTML = '<tr><td colspan="5" class="text-center text-muted">ไม่พบเอกสารในหมวดหมู่นี้</td></tr>';
            return;
        }

        docs.forEach((doc) => {
            const file = doc.source;
            const displayName = doc.original_name || file;
            const category = doc.category;
            const ext = displayName.split('.').pop().toUpperCase();

            const row = document.createElement("tr");
            row.innerHTML = `
                <td>
                    <div class="d-flex align-items-center">
                        <i class="bi bi-file-earmark-pdf-fill pdf-icon"></i>
                        <div>
                            <div class="fw-bold text-dark">${displayName}</div>
                            <small class="text-muted">ขนาด: -</small>
                        </div>
                    </div>
                </td>
                <td class="text-center">
                    <span class="badge bg-light text-dark border">${ext}</span>
                </td>
                <td class="text-center">
                    <span class="text-secondary">${category}</span>
                </td>
                <td class="text-center">
                    <span class="badge badge-active rounded-pill">ใช้งาน</span>
                </td>
                <td class="text-end">
                    <div class="btn-group">
                        <button class="btn btn-sm btn-outline-primary"
                        onclick="window.open('${window.API_BASE}/pdfs/download/${encodeURIComponent(file)}')">
                        <i class="bi bi-eye"></i>
                        </button>
                        <button class="btn btn-sm btn-outline-success"
                        onclick="window.location.href='${window.API_BASE}/pdfs/download/${encodeURIComponent(file)}'">
                        <i class="bi bi-download"></i>
                        </button>
                        <button class="btn btn-sm btn-outline-danger"
                        onclick="deletePDF('${encodeURIComponent(file)}', '${displayName.replace(/'/g, "\\'")}')">
                        <i class="bi bi-trash"></i>
                        </button>
                    </div>
                </td>
            `;
            tbody.appendChild(row);
        });
    }

    // --- ฟังก์ชัน uploadPDF ที่แก้ให้แสดงผลตามความเร็วเน็ตจริง ---
    async function uploadPDF() {
        const fileInput = document.getElementById("pdfFile");
        const category = document.getElementById("category").value;
        const file = fileInput.files[0];
        const btn = document.getElementById("uploadBtn");
        
        // อ้างอิง Progress Elements ใน HTML ของคุณ
        const progressWrapper = document.getElementById("progressWrapper");
        const progressBar = document.getElementById("progressBar");
        const statusText = document.getElementById("uploadStatus");

        if (!file) { alert("กรุณาเลือกไฟล์"); return; }
        // ตรวจสอบขนาดไฟล์ (ตัวอย่าง: ไม่เกิน 50MB)
        if (file.size > 50 * 1024 * 1024) { alert("ไฟล์ใหญ่เกิน 50MB"); return; }

        const formData = new FormData();
        formData.append("file", file);
        formData.append("category", category);

        // UI Setup: แสดง Progress Bar และล็อกปุ่มไม่ให้กดซ้ำ
        btn.disabled = true;
        progressWrapper.style.display = "flex";
        progressBar.style.width = "0%";
        statusText.textContent = "กำลังอัปโหลด...";

        // ใช้ XMLHttpRequest เพื่อดึงค่า Progress จริง
        const xhr = new XMLHttpRequest();
        
        // --- ส่วนสำคัญ: ดึงค่า Progress จากความเร็วเน็ตจริง ---
        xhr.upload.addEventListener("progress", (e) => {
            if (e.lengthComputable) {
                const percent = Math.round((e.loaded / e.total) * 100);
                progressBar.style.width = percent + "%";
                statusText.textContent = `กำลังอัปโหลด: ${percent}%`;
                
                // กรณีถึง 100% แล้ว แต่ยังไม่ขึ้น "เสร็จสิ้น"
                if (percent === 100) {
                    statusText.textContent = "กำลังประมวลผลบน Server...";
                }
            }
        });

        // --- ส่วนสำคัญ: เมื่อ Server รับไฟล์เสร็จสิ้น ---
        xhr.onload = function() {
            if (xhr.status === 200) {
                // สำเร็จ
                statusText.className = "text-success mt-2 d-block";
                statusText.textContent = "✅ อัปโหลดไฟล์เรียบร้อยแล้ว";
                fileInput.value = ""; // ล้างค่า input
                loadPDFs(); // โหลดตารางใหม่
            } else {
                // ผิดพลาด
                statusText.className = "text-danger mt-2 d-block";
                statusText.textContent = "❌ เกิดข้อผิดพลาดในการอัปโหลด";
            }
            
            // ซ่อน Progress Bar หลังจากเสร็จ 3 วินาที
            setTimeout(() => {
                progressWrapper.style.display = "none";
                btn.disabled = false;
                statusText.textContent = "";
            }, 3000);
        };

        xhr.onerror = function() {
            statusText.className = "text-danger mt-2 d-block";
            statusText.textContent = "❌ การเชื่อมต่อล้มเหลว";
            btn.disabled = false;
        };

        xhr.open("POST", `${window.API_BASE}/upload-pdf`);
        xhr.withCredentials = true;   // ต้องเพิ่มบรรทัดนี้
        xhr.send(formData);
    }
    // --- ฟังก์ชันโหลดรายการไฟล์ ---
    async function loadPDFs() {
        const tbody = document.getElementById("pdfList");
        tbody.innerHTML = '<tr><td colspan="5" class="text-center">กำลังโหลดข้อมูล...</td></tr>';

        try {
            const res = await fetch(`${window.API_BASE}/pdfs`, { credentials: "include" });
            const data = await res.json();
            allDocs = data.files || [];
            document.getElementById("filterCategory").value = "";
            document.getElementById("filterCount").textContent = `${allDocs.length} รายการ`;
            renderTable(allDocs);
        } catch (e) {
            tbody.innerHTML = '<tr><td colspan="5" class="text-center text-danger">ไม่สามารถโหลดข้อมูลได้</td></tr>';
        }
    }

    async function deletePDF(encodedSource, displayName) {
        if (!confirm(`ยืนยันการลบไฟล์: ${displayName}?`)) return;
        await fetch(`${window.API_BASE}/pdf/${encodedSource}`, {
            method: "DELETE",
            credentials: "include"
        });
        loadPDFs();
    }

    function toggleSidebar() {
        document.getElementById("sidebar").classList.toggle("collapsed");
    }
    loadPDFs(); // โหลดรายการไฟล์เมื่อเปิดหน้า
</script>
